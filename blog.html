<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Rim Bahadur Oli</title>
    <style>
      :root {
        --bg: #f3f7fc;
        --surface: #ffffff;
        --surface-soft: #edf5ff;
        --text: #101827;
        --muted: #5d6b82;
        --primary: #1d5d8c;
        --primary-2: #0d3d68;
        --line: rgba(15, 23, 42, 0.08);
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, rgba(138, 199, 255, 0.44), transparent 26%), var(--bg);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      img { display: block; width: 100%; }
      .container {
        width: min(960px, calc(100% - 28px));
        margin: 0 auto;
      }
      .page {
        padding: 56px 0 80px;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        margin-bottom: 22px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255,255,255,0.66);
        font-weight: 700;
      }
      .article {
        background: rgba(255,255,255,0.78);
        border: 1px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .article-hero {
        height: 320px;
        background-size: cover;
        background-position: center;
      }
      .article-content {
        padding: 28px 26px 32px;
      }
      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.06;
        letter-spacing: -0.05em;
      }
      p {
        color: var(--muted);
        font-size: 1.04rem;
        line-height: 1.9;
      }
      @media (max-width: 640px) {
        .page { padding-top: 32px; }
        .article-hero { height: 240px; }
        .article-content { padding: 22px 18px 26px; }
      }
    </style>
  </head>
  <body>
    <div class="container page">
      <a class="back-link" href="./index.html">← Back to Home</a>

      <article class="article" id="blogArticle">
        <div class="article-hero" id="articleHero"></div>
        <div class="article-content">
          <div class="meta">
            <span id="articleCategory">Blog</span>
            <span>•</span>
            <span id="articleDate">2026</span>
          </div>
          <h1 id="articleTitle">Blog Post</h1>
          <p id="articleBody"></p>
        </div>
      </article>
    </div>

    <script>
      const BLOG_POSTS = [
        {
          title: 'Welcome to My Personal Website',
          category: 'Welcome',
          date: '2026',
          image: './profile%20logo.jpeg',
          content: 'This website is my personal space where I can share my story, memories, thoughts, and digital identity. I am excited to build my presence and keep documenting the journey ahead.'
        }
      ];

      const params = new URLSearchParams(window.location.search);
      const postIndex = Number(params.get('post') || 0);
      const post = BLOG_POSTS[postIndex] || BLOG_POSTS[0];

      document.getElementById('articleTitle').textContent = post.title;
      document.getElementById('articleCategory').textContent = post.category;
      document.getElementById('articleDate').textContent = post.date;
      document.getElementById('articleHero').style.backgroundImage = `url('${post.image}')`;
      document.getElementById('articleBody').textContent = post.content;
      document.title = `${post.title} | Rim Bahadur Oli`;
    </script>
  </body>
</html>
